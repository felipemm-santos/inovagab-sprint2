spring:
  application:
    name: inovagab-api

  mongodb:
    uri: "${MONGODB_URI:mongodb://inovagab:123456@localhost:27017/inovagab?authSource=admin}"

server:
  port: ${SERVER_PORT:8080}

  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized