spring:
  application:
    name: inovagab-api

  profiles:
    default: local
  data:
    mongodb:
      auto-index-creation: false

server:
  servlet:
    context-path: /api

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
