services:
  mongodb:
    image: mongo:8
    container_name: inovagab-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-inovagab}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-123456}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-inovagab}

    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_ROOT_USERNAME:-inovagab}",
          "--password",
          "${MONGO_ROOT_PASSWORD:-123456}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongodb_data: